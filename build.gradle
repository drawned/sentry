plugins {
    id 'java'
}

project.group = "dev.square"
project.version = "1.5.3"

subprojects {
    apply plugin: 'java'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly("org.projectlombok:lombok:1.18.44")
        annotationProcessor("org.projectlombok:lombok:1.18.44")
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }
}

tasks.register('pushAPI', Exec) {
    def tagName = "v${rootProject.version}"
    doFirst {
        println "Sending ${tagName}"
    }

    commandLine 'git', 'tag', tagName
    finalizedBy 'pushTag'
}

tasks.register('pushTag', Exec) {
    commandLine 'git', 'push', 'origin', "v${rootProject.version}"
}